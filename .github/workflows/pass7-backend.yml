name: Pass 7 backend verification
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-api.txt
      - run: pip check
      - run: PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall -q api core scripts tests
      - name: Run unit tests
        run: python -m unittest discover -v
