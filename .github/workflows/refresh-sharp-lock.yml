name: Refresh sharp lockfile
on:
  push:
    branches:
      - security/sharp-0.35.4
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sharp-0.35.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate sharp lock entry
        working-directory: apps/web
        run: npm install --package-lock-only --save-exact sharp@0.35.4
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/refresh-sharp-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m "security: upgrade sharp to 0.35.4"
          git push origin HEAD:security/sharp-0.35.4
