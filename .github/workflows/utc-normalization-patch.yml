name: UTC normalization branch patch
on:
  push:
    branches: [p2-utc-time-normalization]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[utc-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-utc-time-normalization
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply asserted source transformations
        run: python scripts/apply_utc_normalization.py
      - name: Validate no naive wall-clock calls remain
        run: python -m unittest tests.test_timezone_contract -v
      - name: Commit branch patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api core tests
          git diff --cached --check
          git commit -m "fix: normalize operational timestamps to UTC"
          git push origin HEAD:p2-utc-time-normalization
